<!doctype html>
<html lang="zh-CN">
<head>

  <title>画，从这里开始 · 梵高名画</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111c2c'/%3E%3Ccircle cx='42' cy='20' r='8' fill='%23e5b655'/%3E%3Cpath d='M5 45c16-16 28 10 54-15M5 53c18-14 31 9 54-13' fill='none' stroke='%236e9eb2' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{font-family:ui-sans-serif,"Microsoft YaHei","PingFang SC",sans-serif;color:#f4ebd9;background:#111c2c;font-synthesis:none}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,input{font:inherit}button{cursor:pointer}a{color:#ead4ad}a:hover{color:#fff2d5}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #f4c978;outline-offset:3px}
    .shell{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#111c2c}.canvas-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate}.canvas-wrap::before{content:"";position:absolute;inset:-50px;background-image:var(--bg-image);background-position:center;background-size:cover;filter:blur(30px) brightness(.42) saturate(.85);transform:scale(1.06);z-index:-1}.canvas-wrap::after{content:"";position:absolute;inset:0;background:#111c2c33;z-index:-1}.artboard{position:relative;height:min(100dvh,calc(100vw / var(--ratio,1.3)));width:auto;max-width:100vw;aspect-ratio:var(--ratio,1.3);background:#0c1727;box-shadow:0 0 100px #0009;overflow:hidden;will-change:transform}.artboard canvas,.finished-image{position:absolute;inset:0;display:block;width:100%;height:100%}.finished-image{object-fit:fill;opacity:0;pointer-events:none}.load-message{position:absolute;z-index:2;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;line-height:1.7;background:#eee6d3;color:#394249}.load-message[hidden]{display:none}
    .top{position:absolute;top:0;right:0;z-index:2;padding:22px 28px}.top-actions{display:flex;flex-direction:column;align-items:stretch;gap:8px}.glass-button{border:1px solid #f4ebd968;background:#112232bf;color:#fff3d9;border-radius:999px;padding:10px 17px;min-height:42px;backdrop-filter:blur(10px)}.glass-button:hover{background:#2b455acb}.art-nav{position:absolute;z-index:2;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}.art-nav button{width:44px;height:44px;padding:0;border:1px solid #f4ebd968;border-radius:50%;background:#112232bf;color:#fff3d9;font-size:25px;line-height:1;backdrop-filter:blur(10px)}.art-nav button:hover{background:#2b455acb}.art-nav button:disabled{opacity:.45;cursor:not-allowed}
    .backdrop{position:absolute;inset:0;z-index:3;background:#07121bb9}.sidebar{position:absolute;z-index:4;top:0;right:0;bottom:0;width:min(390px,100vw);padding:25px 24px;background:#172637;box-shadow:-15px 0 60px #0007;overflow-y:auto}.sidebar[hidden],.backdrop[hidden],.welcome[hidden]{display:none}.side-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.side-title{font:normal 25px Georgia,"Songti SC",serif;margin:0}.side-sub{font-size:11px;color:#9db1b1;letter-spacing:.14em;margin:5px 0 19px}.close-button{background:transparent;color:#f7edda;border:1px solid #71818b;border-radius:50%;font-size:25px;width:38px;height:38px;line-height:1}.art-list{display:grid;gap:6px}.art-item{border:1px solid transparent;background:transparent;color:#d2d5cd;padding:9px 7px;display:flex;text-align:left;gap:12px;align-items:center;min-height:59px;width:100%}.art-item:hover{background:#26384a}.art-item[aria-current="true"]{background:#31475a;border-color:#bd9963;color:#fff5df}.thumb,.thumb-placeholder{height:44px;width:48px;object-fit:cover;background:#4f5960;flex:none}.thumb-placeholder{display:grid;place-items:center;font-size:10px;color:#e6ded0}.art-item strong{display:block;font-weight:500;font-size:13px}.art-item small{display:block;margin-top:4px;color:#a6b2af;font-size:10px}.side-divider{height:1px;background:#44525c;margin:19px 0}.detail-name{font:normal 25px Georgia,"Songti SC",serif;margin:0 0 7px}.detail-en{font-size:11px;color:#a7b7b4;margin:0 0 15px}.facts{display:grid;grid-template-columns:44px 1fr;gap:9px 10px;margin:0;font-size:12px;line-height:1.6}.facts dt{color:#8ea5a8}.facts dd{margin:0}.source{font-size:11px;line-height:1.6;margin:10px 0 0}.source a{overflow-wrap:anywhere}.playback{border:1px solid #50616b;background:#203347;padding:14px;margin:16px 0 19px}.playback-title{margin:0 0 11px;color:#d6bd8f;font-size:12px;letter-spacing:.08em}.playback-actions{display:flex;gap:8px}.menu-button{border:1px solid #d5b784;background:#e7c68c;color:#142333;padding:9px 14px;min-height:40px}.menu-button:hover{background:#f5dca9}.menu-button:disabled{opacity:.45;cursor:not-allowed}.menu-button.secondary{background:transparent;color:#f3e7d1}.menu-button.secondary:hover{background:#30475a}.interpretation{font-size:11px;line-height:1.6;color:#a8b7b5;margin:17px 0 0}.catalog-search{width:100%;border:1px solid #71818b;border-radius:4px;background:#102131;color:#fff4df;padding:10px 12px;margin:0 0 8px}.catalog-search::placeholder{color:#9fb0b3}.catalog-count{font-size:11px;color:#b6c4c2;margin:0 0 10px}.load-more{width:100%;margin:12px 0 4px}.welcome{position:absolute;z-index:6;inset:0;display:grid;place-items:center;padding:22px;background:linear-gradient(120deg,#0b1725e8,#102539db),url('images/starry.jpg') center/cover}.welcome-card{width:min(470px,100%);padding:42px 34px;text-align:center;background:#101e2de8;border:1px solid #cab17c91;box-shadow:0 20px 80px #000a}.welcome-icon{font-size:40px;margin:0 0 13px}.welcome h1{font:normal clamp(26px,5vw,38px) Georgia,"Songti SC",serif;color:#f5d99e;margin:0 0 16px}.welcome p{font-size:14px;line-height:1.8;color:#e0dfd7;margin:0 0 23px}.enter-button{border:1px solid #e7c68c;background:#e7c68c;color:#122334;padding:12px 30px;font-size:15px;min-height:46px}.enter-button:hover{background:#f7dda9}.welcome-note{display:block;margin-top:17px;color:#9eadaf;font-size:11px}
    @media (max-width:600px), (max-height:500px) and (pointer:coarse){
      .artboard{width:100%;height:100%;max-width:none;aspect-ratio:auto}
      .finished-image{object-fit:cover}
      .top{padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 12px}
      .top-actions{gap:7px}.glass-button{min-height:44px;padding:8px 12px;font-size:12px;touch-action:manipulation}
      .art-nav{right:calc(12px + env(safe-area-inset-right));gap:9px}
      .art-nav button{width:48px;height:48px;font-size:25px;touch-action:manipulation}
      .sidebar{padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
      .close-button{width:44px;height:44px}.art-item{min-height:64px}.menu-button,.catalog-search{min-height:44px}
      .welcome{padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
      .welcome-card{max-height:100%;overflow-y:auto;padding:30px 20px}.enter-button{min-height:48px;touch-action:manipulation}
    }

</head>
<body>
  <main class="shell">
    <div id="canvas-wrap" class="canvas-wrap"><div id="artboard" class="artboard"><canvas id="painting-canvas" aria-hidden="true"></canvas><img id="finished-image" class="finished-image" alt=""><div id="load-message" class="load-message" role="status">正在准备画布…</div></div></div>
    <header class="top"><div class="top-actions"><button id="gallery-toggle" class="glass-button" type="button" aria-controls="sidebar" aria-expanded="false">作品与播放</button><button id="music-button" class="glass-button" type="button" aria-label="开启背景音乐">♫ 开启音乐</button></div></header>
    <nav class="art-nav" aria-label="画作切换"><button id="previous-art" type="button" aria-label="上一幅画" title="上一幅画">↑</button><button id="restart-art" type="button" aria-label="重播当前画的粒子动画" title="重播当前画">↶</button><button id="next-art" type="button" aria-label="下一幅画" title="下一幅画">↓</button></nav>
    <div id="sidebar-backdrop" class="backdrop" hidden></div><aside id="sidebar" class="sidebar" aria-label="作品与播放菜单" aria-hidden="true" hidden><div class="side-top"><h2 class="side-title">作品与播放</h2><button id="close-gallery" class="close-button" type="button" aria-label="关闭菜单">×</button></div><div class="playback"><p class="playback-title">播放控制 · 0.75×</p><div class="playback-actions"><button id="play-button" class="menu-button" type="button">播放</button><button id="replay-button" class="menu-button secondary" type="button">从头再看</button></div></div><p class="side-sub">梵高绘画目录 / PAINTINGS</p><input id="catalog-search" class="catalog-search" type="search" placeholder="搜索标题、年代或目录编号" aria-label="搜索绘画"><p id="catalog-count" class="catalog-count" aria-live="polite"></p><div id="art-list" class="art-list"></div><button id="load-more" class="menu-button secondary load-more" type="button" hidden>显示更多作品</button><div class="side-divider"></div><h3 id="detail-name" class="detail-name"></h3><p id="detail-en" class="detail-en"></p><dl class="facts"><dt>年代</dt><dd id="detail-year"></dd><dt>馆藏</dt><dd id="detail-museum"></dd><dt>编号</dt><dd id="detail-code"></dd></dl><p class="source">图像来源：<a id="detail-source" target="_blank" rel="noopener noreferrer"></a></p><p class="source">作品资料：<a id="detail-catalog-source" target="_blank" rel="noopener noreferrer">Van Gogh Worldwide</a></p><p class="interpretation">粒子汇聚与画面显现是基于原作图像的视觉演绎，并非梵高真实的创作顺序。画作图片已随网站保存。</p></aside>
    <div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title"><div class="welcome-card"><div class="welcome-icon" aria-hidden="true">♫</div><h1 id="welcome-title">戴上耳机，效果更佳</h1><p>让音乐与色彩一同展开。点击进入后，画作将开始汇聚，背景音乐也会随之播放。</p><button id="enter-button" class="enter-button" type="button">进入展厅</button><span class="welcome-note">可随时在右上角关闭音乐</span></div></div>
    <audio id="ambient-audio" src="audio/van-gogh-ambient.mp3" preload="none" loop></audio>
  </main>
  <script src="app.js?v=3"></script>
</body>
</html>
